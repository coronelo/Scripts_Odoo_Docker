{% extends 'base.html' %}

{% block content %}
<h1>Crear Nuevo Entorno Odoo</h1>

<div class="card" style="max-width: 800px;">
    {% if error %}
    <div style="background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 1rem; border-radius: 8px; margin-bottom: 2rem;">
        <strong>Error:</strong> {{ error }}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
            <div>
                <label style="display: block; color: var(--text-dim); margin-bottom: 0.5rem;">Nombre del Proyecto</label>
                <input type="text" name="name" placeholder="Ej: MiEmpresa_Odoo" required
                    style="width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 0.75rem; border-radius: 8px; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; color: var(--text-dim); margin-bottom: 0.5rem;">Versión de Odoo</label>
                <select name="version" 
                    style="width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 0.75rem; border-radius: 8px; box-sizing: border-box;">
                    <option value="19">Odoo 19 (Latest)</option>
                    <option value="18">Odoo 18</option>
                    <option value="17">Odoo 17</option>
                </select>
            </div>
        </div>

        <div style="margin-top: 2rem;">
            <label style="display: block; color: var(--text-dim); margin-bottom: 0.5rem;">Modo de Despliegue</label>
            <div style="display: flex; gap: 2rem;">
                <label><input type="radio" name="deploy_mode" value="local" checked> Local (Solo IP)</label>
                <label><input type="radio" name="deploy_mode" value="online"> Online (Dominio + SSL)</label>
            </div>
        </div>

        <div id="domain-section" style="margin-top: 2rem; display: none;">
            <label style="display: block; color: var(--text-dim); margin-bottom: 0.5rem;">Dominio</label>
            <input type="text" name="domain" placeholder="odoo.miempresa.com"
                style="width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 0.75rem; border-radius: 8px; box-sizing: border-box;">
        </div>

        <div style="margin-top: 3rem; display: flex; gap: 1rem;">
            <button type="submit" id="submit-btn" style="flex: 1; padding: 1rem; font-size: 1rem;">🚀 Crear y Desplegar Entorno</button>
            <a href="{% url 'index' %}" style="flex: 1; text-decoration: none;"><button type="button" style="width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.1); padding: 1rem; font-size: 1rem;">Cancelar</button></a>
        </div>
    </form>
</div>

<!-- Overlay de Carga -->
<div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(8px);">
    <div style="width: 50px; height: 50px; border: 4px solid var(--accent-primary); border-top: 4px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 2rem;"></div>
    <h2 style="margin: 0; color: #fff;">Desplegando Contenedores...</h2>
    <p style="color: var(--text-dim); margin-top: 1rem;">Esto puede tardar hasta 30 segundos mientras Odoo y Postgres se inicializan.</p>
</div>

<style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<script>
    const form = document.querySelector('form');
    const overlay = document.getElementById('loading-overlay');
    
    form.addEventListener('submit', () => {
        overlay.style.display = 'flex';
    });

    document.querySelectorAll('input[name="deploy_mode"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            const domainSection = document.getElementById('domain-section');
            domainSection.style.display = e.target.value === 'online' ? 'block' : 'none';
        });
    });
</script>
{% endblock %}
